spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/recipes_db
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8090/realms/recipes
          jwk-set-uri: http://keycloak:8090/realms/recipes/protocol/openid-connect/certs

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.abn.recipes: DEBUG
    org.springframework.security: DEBUG

