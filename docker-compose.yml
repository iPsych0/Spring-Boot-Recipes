services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: recipes_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/recipes_db
      KC_DB_USERNAME: user
      KC_DB_PASSWORD: password
      KC_HTTP_PORT: 8090
    ports:
      - "8090:8090"
    depends_on:
      - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - postgres
      - keycloak
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"

volumes:
  postgres_data: